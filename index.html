:root {

* { box-sizing: border-box; }

html, body {

canvas#view {

  gap: 8px;
  align-items: center;

button {

  border: 1px solid #444;

  cursor: pointer;
  border-radius: 4px;
}

input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
#time { font-size: 12px; opacity: .7; min-width: 90px; }

#hint {
  position: fixed;
  top: 12px; left: 50%;

  background: rgba(0,0,0,.8);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 4px;
  z-index: 6;
  display: none;
  max-width: 92vw;
  text-align: center;
}
</style>

<!-- LIRIK (tersembunyi, tidak tampil di halaman)
     Format: menit:detik | teks | warna | gambar (opsional) | latar (opsional: pita, dua, panel, none)
     Kolom ke-4 bisa gambar (.png/.jpg) atau video (.mp4/.webm). Video latar hijau otomatis dihilangkan hijaunya.
     Tulis  lanjut  di kolom ke-4 supaya baris itu tetap memakai gambar/video dari baris sebelumnya (tidak mulai ulang).
     Baris yang punya gambar atau latar di kolom ke-4/5 warnanya dikunci sesuai yang ditulis di kolom warna.
     Contoh: 00:42 | Come With Me | #e8d44d | | dua   (gambar dikosongkan, latar dua panel)
     Kolom ke-6 = tengah  menaruh teks di tengah gambar/video. Tambah angka = teks baru muncul setelah sekian detik (misal pintu terbuka):
     00:45 | Room | #d9d2bd | pintu.mp4 | | tengah 1.2   (teks muncul 1,2 detik setelah baris mulai)
     Warna: satu warna = semua huruf. Beberapa warna = sesuai jumlah kata,
     atau sesuai jumlah huruf (satu warna per huruf). Kata dalam [ ] = warna sorot.
     Baris MOMENT: tanpa latar, hurufnya berganti halus dari warna ke warna sesuai daftar (mulai dari warna pertama).
     Baris gambar: kolom teks dikosongkan, nama file di kolom ke-4. -->

<script>
// ====== PENGATURAN ======
const AUDIO_SRC = "SnapTik_Cinderella_Mac_Miller_with_emm_macmiller.mp4"; // nama file video di repo (harus persis sama)
const DEFAULT_COLOR = "#f5f0df";   // warna teks bawaan
const HIGHLIGHT = "#ff4fd8";       // warna kata dalam [ ]
const KATA_BERGANTI = ["moment"];  // baris yang teksnya persis kata ini, warnanya berganti-ganti otomatis
const KECEPATAN_WARNA = 1.2;       // kecepatan pergantian warna huruf MOMENT (1.2 = tiap warna sekitar 0,8 detik), makin kecil makin pelan
const PAKAI_WARNA_BERAGAM = true;  // true = warna tiap baris diacak dari daftar di bawah (isi lirik tidak diubah)
const WARNA_BERAGAM = ["#ffffff", "#e8d44d", "#f2a65a", "#f5f0df", "#ffd1a1"];
const LATAR_POLA = ["pita", "none", "dua", "none", "panel", "pita", "none", "none"]; // latar tiap baris, berulang. pilihan: pita, dua, panel, none
const TEKS_ATAS = 0.12;            // posisi lirik saat ada gambar/video (0 = paling atas, 0.5 = tengah)
const UKURAN_TEKS_ATAS = 0.13;     // ukuran lirik saat ada gambar/video (makin besar makin besar hurufnya)
const TEKS_TENGAH = 0.55;          // tinggi teks yang memakai  tengah  (0.5 = tengah layar, naikkan angkanya = teks turun)
const UKURAN_TEKS_TENGAH = 0.16;   // ukuran huruf teks yang memakai  tengah
const MEDIA_LEBAR = 1.0;           // lebar kotak gambar/video (1 = selebar layar)
const MEDIA_TINGGI = 0.95;         // tinggi kotak gambar/video (1 = setinggi layar)
const MEDIA_TENGAH = 0.55;         // posisi tengah gambar/video dari atas (0.5 = tengah layar)
const MEDIA_ZOOM = 1.4;            // pembesar khusus VIDEO (1 = pas kotak, 1.4 = 40% lebih besar, boleh melebihi layar)
const CHROMA_KEY = true;           // true = warna hijau pada video (green screen) dibuat transparan
const TILT_DERAJAT = -4;           // kemiringan teks (minus = naik ke kanan, 0 = lurus)
const PERSPEKTIF = 0.18;           // sisi kiri lebih besar dari kanan (0 = rata)
const RAMP = " .:-=+*#%@";         // urutan karakter dari terang lemah ke kuat
const SCRAMBLE = "abcdefghijklmnopqrstuvwxyz0123456789@#$%&*+=";
// ========================

const view = document.getElementById("view");
const vctx = view.getContext("2d");
const off = document.createElement("canvas");   // teks setelah dimiringkan
const octx = off.getContext("2d", { willReadFrequently: true });
const off2 = document.createElement("canvas");  // gambar/video setelah dimiringkan
const octx2 = off2.getContext("2d", { willReadFrequently: true });
const tcv = document.createElement("canvas");   // lapisan teks
const tctx = tcv.getContext("2d");
const mcv = document.createElement("canvas");   // lapisan gambar/video (terpisah dari teks)
const mctx = mcv.getContext("2d");
const bgs = {};
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);

let cols, rows, cw, chh, fontPx, VW, VH;
let timeline = [];
let audioReady = false;
let playing = false;
let clockStart = 0;
let pausedAt = 0;
let mediaAktif = false;
const gagal = [];

// ---------- pesan jika file gagal dimuat ----------
function laporGagal(nama) {
  if (!gagal.includes(nama)) gagal.push(nama);
  const h = $("hint");
  h.textContent = "Gagal memuat: " + gagal.join(", ") + ". Cek nama file di folder (harus persis sama) dan formatnya (mp4 H.264), lalu Ctrl+F5.";
  h.style.display = "block";
}

// ---------- ukuran layar ----------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = innerWidth * dpr;
  view.height = innerHeight * dpr;
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  fontPx = innerWidth < 600 ? 7 : 10;
  cw = fontPx * 0.6;
  chh = fontPx;
  cols = Math.floor(innerWidth / cw);
  rows = Math.floor(innerHeight / chh);
  [off, off2, tcv, mcv].forEach(c => { c.width = cols; c.height = rows; });
  makeBackgrounds();
  VW = cols;
  VH = rows * chh / cw; // tinggi "virtual" agar huruf tidak melar
}
addEventListener("resize", resize);

// ---------- parsing lirik ----------
function parse(txt) {
  return txt.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("//"))
    .map(l => {
      const p = l.split("|").map(s => s.trim());
      const m = p[0].match(/^(\d+):(\d+(?:\.\d+)?)$/);
      if (!m) return null;

      const pal = (p[2] || "").split(/\s+/).filter(c => /^#[0-9a-fA-F]{3,8}$/.test(c));
      if (!pal.length) pal.push(DEFAULT_COLOR);

      const e = {
        t: +m[1] * 60 + +m[2],
        text: p[1] || "",
        pal,
        anim: /\bganti\b/i.test(p[2] || "") || KATA_BERGANTI.includes((p[1] || "").trim().toLowerCase()),
        img: p[3] && !p[3].startsWith("#") && !/^(lanjut|=)$/i.test(p[3]) ? p[3] : "",
        cont: /^(lanjut|=)$/i.test(p[3] || ""),
        latar: (p[4] || "").toLowerCase(),
        posisi: (p[5] || "").toLowerCase().split(/\s+/)[0],
        tunda: parseFloat(((p[5] || "").split(/\s+/)[1] || "0")) || 0, // teks baru muncul setelah sekian detik
        imgEl: null
      };
      e.lock = !!(e.img || e.latar || e.cont); // warna dikunci, tidak diacak otomatis
      e.vidEl = null;
      if (/\.(mp4|webm|mov)$/i.test(e.img)) {
        // video: dimuat diam-diam, diputar saat barisnya tampil
        const v = document.createElement("video");
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.preload = "auto";
        v.crossOrigin = "anonymous";
        v.addEventListener("loadeddata", () => {
          e.vidEl = v;
          // pemanasan sekali supaya saat tampil langsung lancar, tidak tersendat
          v.play().then(() => {
            if (activeVid !== v) { v.pause(); v.currentTime = 0; }
          }).catch(() => {});
        });
        v.addEventListener("error", () => { e.vidEl = null; laporGagal(e.img); });
        v.src = e.img;
      } else if (e.img) {
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => (e.imgEl = im);
        im.onerror = () => { e.imgEl = null; laporGagal(e.img); };
        im.src = e.img;
      }
      return e;
    })
    .filter(Boolean)
    .sort((a, b) => a.t - b.t);
}

function applyLyrics() {
  timeline = parse($("lyrics").value);

  // baris "lanjut" memakai gambar/video dari baris sebelumnya
  let sumber = null;
  timeline.forEach(e => {
    if (e.img) sumber = e;
    else if (e.cont && sumber) e.dari = sumber;
    else sumber = null;
  });
  // kapan kelompok gambar/video berakhir (saat baris pertama yang bukan lanjutannya muncul)
  timeline.forEach((e, i) => {
    if (!e.img) return;
    let j = i + 1;
    while (j < timeline.length && timeline[j].dari === e) j++;
    e.gEnd = j < timeline.length ? timeline[j].t : Infinity;
  });

  if (PAKAI_WARNA_BERAGAM) {
    timeline.forEach((e, i) => {
      if (e.anim || e.lock) return; // baris MOMENT dan baris yang dikunci tetap
      const k = i % WARNA_BERAGAM.length;
      e.pal = WARNA_BERAGAM.slice(k).concat(WARNA_BERAGAM.slice(0, k));
    });
  }
  updateSeekMax();
}

// ---------- pewarnaan teks ----------
// campur dua warna berurutan di daftar, pos = posisi desimal (misal 1.4 = 40% menuju warna ke-3)
function mixColor(pal, pos) {
  const n = pal.length;
  const base = Math.floor(pos);
  const f = pos - base;
  const a = parseInt(pal[base % n].slice(1, 7), 16);
  const b = parseInt(pal[(base + 1) % n].slice(1, 7), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - f) + ((b >> s) & 255) * f);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// shift terisi = seluruh kata satu warna yang berganti halus (animasi)
// 1 warna = semua huruf | jumlah warna = jumlah huruf -> per huruf | selain itu -> per kata
function colorize(text, pal, shift) {
  let plain = "";
  const hl = [];
  text.split(/(\[[^\]]*\])/).forEach(s => {
    if (!s) return;
    const isH = s.startsWith("[") && s.endsWith("]");
    for (const ch of isH ? s.slice(1, -1) : s) { plain += ch; hl.push(isH); }
  });

  const letters = plain.replace(/\s/g, "").length;
  const mixed = shift !== undefined ? mixColor(pal, shift) : null;
  let li = 0, wi = -1, inWord = false, prev = pal[0];
  const parts = [];
  for (let i = 0; i < plain.length; i++) {
    const ch = plain[i];
    let c;
    if (/\s/.test(ch)) {
      inWord = false;
      c = prev;
    } else {
      if (!inWord) { wi++; inWord = true; }
      c = mixed ? mixed
        : pal.length === 1 ? pal[0] : pal.length === letters ? pal[li] : pal[wi % pal.length];
      li++;
    }
    if (hl[i]) c = HIGHLIGHT;
    prev = c;
    const last = parts[parts.length - 1];
    if (last && last.c === c) last.s += ch; else parts.push({ s: ch, c });
  }
  return parts;
}

// ---------- waktu ----------
function now() {
  if (audioReady) return audio.currentTime;
  return playing ? (performance.now() - clockStart) / 1000 : pausedAt;
}

function duration() {
  if (audioReady && isFinite(audio.duration)) return audio.duration;
  const last = timeline[timeline.length - 1];
  return last ? last.t + 5 : 30;
}

function updateSeekMax() { $("seek").max = duration(); }

function fmt(s) {
  s = Math.max(0, s);
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}

// ---------- latar bertekstur di belakang lirik ----------
function makeBackgrounds() {
  const mk = fn => {
    const c = document.createElement("canvas");
    c.width = cols; c.height = rows;
    fn(c.getContext("2d"));
    return c;
  };
  const cell = (g, x, y, base, spread) => {
    if (x < 0 || y < 0 || x >= cols || y >= rows) return;
    const k = 1 - spread * Math.random();
    g.fillStyle = `rgb(${(base[0] * k) | 0},${(base[1] * k) | 0},${(base[2] * k) | 0})`;
    g.fillRect(x, y, 1, 1);
  };
  const jag = (v, lim) => Math.max(-lim, Math.min(lim, v + (Math.random() - 0.5) * 2));

  // pita lebar dengan tepi bergerigi
  bgs.pita = mk(g => {
    const top = rows * 0.36, bot = rows * 0.66, lim = rows * 0.05;
    let jt = 0, jb = 0;
    for (let x = 0; x < cols; x++) {
      jt = jag(jt, lim); jb = jag(jb, lim);
      for (let y = Math.floor(top + jt); y < bot + jb; y++) cell(g, x, y, [205, 172, 142], 0.45);
    }
  });

  // dua panel kiri dan kanan, tengah gelap
  bgs.dua = mk(g => {
    [[0, 0.36, [190, 150, 105]], [0.66, 1, [170, 140, 120]]].forEach(([a, b, col]) => {
      for (let x = Math.floor(cols * a); x < cols * b; x++)
        for (let y = Math.floor(rows * 0.3); y < rows * 0.74; y++) cell(g, x, y, col, 0.5);
    });
  });

  // panel besar di tengah
  bgs.panel = mk(g => {
    for (let x = Math.floor(cols * 0.12); x < cols * 0.9; x++) {
      const fade = 1 - 0.35 * Math.abs((x / cols - 0.5) * 2);
      for (let y = Math.floor(rows * 0.2); y < rows * 0.8; y++)
        cell(g, x, y, [215 * fade, 195 * fade, 172 * fade], 0.3);
    }
  });
}

// ---------- gambar teks ke canvas kecil ----------
function charsOf(parts) {
  const a = [];
  parts.forEach(p => { for (const ch of p.s) a.push({ ch, c: p.c }); });
  return a;
}

// pecah per kata jadi baris, ukuran dipakai untuk mengecek muat atau tidak
function wrapLines(chars, size, maxW) {
  tctx.font = `700 ${size}px "Segoe UI", Arial, sans-serif`;
  const wd = c => tctx.measureText(c.ch).width;
  const words = [];
  let cur = [];
  chars.forEach(c => {
    if (c.ch === " ") { if (cur.length) words.push(cur); cur = []; }
    else cur.push(c);
  });
  if (cur.length) words.push(cur);

  const space = tctx.measureText(" ").width;
  const lines = [];
  let line = [], lw = 0, widest = 0;
  words.forEach(w => {
    const ww = w.reduce((a, c) => a + wd(c), 0);
    if (line.length && lw + space + ww > maxW) {
      lines.push({ chars: line, w: lw });
      widest = Math.max(widest, lw);
      line = []; lw = 0;
    }
    if (line.length) { line = line.concat([{ ch: " ", c: line[line.length - 1].c }]); lw += space; }
    line = line.concat(w);
    lw += ww;
  });
  if (line.length) { lines.push({ chars: line, w: lw }); widest = Math.max(widest, lw); }
  return { lines, widest };
}

// hilangkan warna hijau dari frame video (green screen), ukuran dibatasi supaya ringan
const kc = document.createElement("canvas");
const kctx = kc.getContext("2d", { willReadFrequently: true });
function keyGreen(v, iw, ih) {
  const w = Math.max(2, Math.min(400, Math.round(iw * 1.5)));
  const h = Math.max(2, Math.round(w * ih / iw));
  if (kc.width !== w) kc.width = w;
  if (kc.height !== h) kc.height = h;
  kctx.clearRect(0, 0, w, h);
  kctx.drawImage(v, 0, 0, w, h);
  const img = kctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    if (g > 90 && g > r * 1.3 && g > b * 1.3) d[i + 3] = 0;
  }
  kctx.putImageData(img, 0, 0);
  return kc;
}

// putar video hanya saat barisnya tampil, ikut main/jeda
let activeVid = null;
function syncVideo(v) {
  if (activeVid && activeVid !== v) { activeVid.pause(); activeVid = null; }
  if (!v) return;
  if (activeVid !== v) { activeVid = v; if (v.currentTime > 0.05) v.currentTime = 0; }
  if (playing && v.paused) v.play().catch(() => {});
  else if (!playing && !v.paused) v.pause();
}

function drawEntry(e, alpha, idx) {
  tctx.globalAlpha = alpha;
  const adaMedia = e.img || e.cont; // baris dengan gambar/video: tanpa latar bertekstur
  const gaya = e.anim ? "none" : (e.latar || (adaMedia ? "none" : LATAR_POLA[idx % LATAR_POLA.length]));
  if (bgs[gaya]) {
    tctx.save();
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.drawImage(bgs[gaya], 0, 0);
    tctx.restore();
  }
  tctx.globalAlpha = alpha;

  const m = e.dari || e; // sumber gambar/video
  const vid = m.vidEl && m.vidEl.videoWidth ? m.vidEl : null;
  const hasImg = vid || (m.imgEl && m.imgEl.naturalWidth);
  const tengah = hasImg && e.posisi === "tengah"; // teks di tengah gambar/video (misal di dalam pintu)
  const cy = tengah ? VH * TEKS_TENGAH : hasImg ? VH * TEKS_ATAS : VH * 0.5;

  const parts = e.anim ? colorize(e.text, e.pal, Math.max(0, now() - e.t) * KECEPATAN_WARNA) : colorize(e.text, e.pal);
  const chars = charsOf(parts);

  // maksimal 2 baris, besar sebisanya
  const maxW = VW * 0.86;
  let size = VH * (tengah ? UKURAN_TEKS_TENGAH : hasImg ? UKURAN_TEKS_ATAS : 0.2), lay;
  for (let k = 0; k < 25; k++) {
    lay = wrapLines(chars, size, maxW);
    if (lay.lines.length <= 2 && lay.widest <= maxW) break;
    size *= 0.9;
  }

  tctx.font = `700 ${size}px "Segoe UI", Arial, sans-serif`;
  tctx.textAlign = "left";
  tctx.textBaseline = "middle";
  const lh = size * 1.12;
  let y = cy - (lay.lines.length - 1) * lh / 2;
  lay.lines.forEach(L => {
    let x = VW / 2 - L.w / 2;
    L.chars.forEach(c => {
      tctx.fillStyle = c.c;
      tctx.fillText(c.ch, x, y);
      x += tctx.measureText(c.ch).width;
    });
    y += lh;
  });
  tctx.globalAlpha = 1;

  // gambar/video digambar di lapisan sendiri, jadi tidak ikut memudar atau terurai saat lirik berganti
  if (hasImg) {
    const im = vid || m.imgEl;
    const mw = vid ? vid.videoWidth : im.naturalWidth;
    const mh = vid ? vid.videoHeight : im.naturalHeight;
    const solo = !e.text; // gambar tanpa teks = tampil besar di tengah
    const boxW = VW * (solo ? 0.9 : MEDIA_LEBAR), boxH = VH * (solo ? 0.9 : MEDIA_TINGGI);
    const cyImg = VH * (solo ? 0.5 : MEDIA_TENGAH);
    const sc = Math.min(boxW / mw, boxH / mh) * (vid && !solo ? MEDIA_ZOOM : 1);
    const iw = mw * sc, ih = mh * sc;
    const tNow = now();
    mctx.globalAlpha = Math.max(0, Math.min(1, (tNow - m.t) / 0.12, (m.gEnd - tNow) / 0.1));
    const src = vid && CHROMA_KEY ? keyGreen(vid, iw, ih) : im;
    mctx.drawImage(src, VW / 2 - iw / 2, cyImg - ih / 2, iw, ih);
    mctx.globalAlpha = 1;
    mediaAktif = true;
  }
}

// miringkan + beri perspektif: potong per kolom, geser dan skala tiap kolom
function warp(srcCv, dst) {
  const slope = Math.tan(TILT_DERAJAT * Math.PI / 180) * (cw / chh); // baris per kolom
  for (let x = 0; x < cols; x++) {
    const u = x / cols - 0.5;
    const s = 1 - PERSPEKTIF * u;
    const yc = rows / 2 + slope * (x - cols / 2);
    const h = rows * s;
    dst.drawImage(srcCv, x, 0, 1, rows, x, yc - h / 2, 1, h);
  }
}

// kelompok huruf per warna supaya gambar lebih cepat
const buckets = new Map();

// ---------- loop utama ----------
function frame() {
  const t = now();

  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.fillStyle = "#000";
  tctx.fillRect(0, 0, cols, rows);
  tctx.setTransform(1, 0, 0, cw / chh, 0, 0);
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = "#000";
  mctx.fillRect(0, 0, cols, rows);
  mctx.setTransform(1, 0, 0, cw / chh, 0, 0);
  mediaAktif = false;

  let idx = -1;
  for (let i = 0; i < timeline.length; i++) if (t >= timeline[i].t) idx = i;

  let local = 99;
  let vidNow = null;
  if (idx >= 0) {
    const e = timeline[idx];
    const next = timeline[idx + 1];
    const end = next ? next.t : (e.img ? Infinity : e.t + 4);
    local = t - e.t - e.tunda;
    const fadeIn = Math.min(1, local / (e.tunda ? 0.5 : 0.12));
    const fadeOut = Math.min(1, (end - t) / 0.1);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    vidNow = (e.dari || e).vidEl || null;
    drawEntry(e, alpha, idx);
  }
  syncVideo(vidNow);

  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = "#000";
  octx.fillRect(0, 0, cols, rows);
  warp(tcv, octx);
  const dT = octx.getImageData(0, 0, cols, rows).data;

  let dM = null;
  if (mediaAktif) {
    octx2.setTransform(1, 0, 0, 1, 0, 0);
    octx2.fillStyle = "#000";
    octx2.fillRect(0, 0, cols, rows);
    warp(mcv, octx2);
    dM = octx2.getImageData(0, 0, cols, rows).data;
  }

  // latar transparan (video di belakang disembunyikan lewat CSS)
  vctx.clearRect(0, 0, innerWidth, innerHeight);
  vctx.font = `${fontPx}px Consolas, "Courier New", monospace`;
  vctx.textBaseline = "top";

  const decode = local < 0.5 ? local / 0.5 : 1; // efek "terurai" hanya untuk teks saat baris baru muncul
  buckets.forEach(a => (a.length = 0));

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      let r = dT[i], g = dT[i + 1], b = dT[i + 2];
      let lum = Math.max(r, g, b) / 255;
      let isText = true;
      if (lum < 0.07) {
        if (!dM) continue;
        r = dM[i]; g = dM[i + 1]; b = dM[i + 2];
        lum = Math.max(r, g, b) / 255;
        if (lum < 0.07) continue;
        isText = false;
      }

      let ch = RAMP[Math.min(RAMP.length - 1, Math.floor(lum * RAMP.length))];
      if (isText && Math.random() > decode) ch = SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0];
      else if (Math.random() < 0.015) ch = RAMP[Math.max(1, RAMP.length - 2 - ((Math.random() * 3) | 0))];

      const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
      let arr = buckets.get(key);
      if (!arr) { arr = []; buckets.set(key, arr); }
      arr.push(x * cw, y * chh, ch);
    }
  }

  buckets.forEach((arr, key) => {
    if (!arr.length) return;
    vctx.fillStyle = `rgb(${(((key >> 10) & 31) << 3) | 4},${(((key >> 5) & 31) << 3) | 4},${((key & 31) << 3) | 4})`;
    for (let k = 0; k < arr.length; k += 3) vctx.fillText(arr[k + 2], arr[k], arr[k + 1]);
  });

  // UI waktu
  $("time").textContent = fmt(t) + " / " + fmt(duration());
  if (document.activeElement !== $("seek")) $("seek").value = t;

  requestAnimationFrame(frame);
}

// ---------- kontrol ----------
function play() {
  if (audioReady) audio.play().catch(() => {});
  else clockStart = performance.now() - pausedAt * 1000;
  playing = true;
  $("play").textContent = "⏸ Jeda";
}

function pause() {
  if (audioReady) audio.pause();
  else pausedAt = (performance.now() - clockStart) / 1000;
  playing = false;
  $("play").textContent = "▶ Mulai";
}

$("play").onclick = () => (playing ? pause() : play());

$("seek").oninput = e => {
  const v = +e.target.value;
  if (audioReady) audio.currentTime = v;
  else {
    pausedAt = v;
    clockStart = performance.now() - v * 1000;
  }
};

audio.addEventListener("loadedmetadata", () => { audioReady = true; updateSeekMax(); });
audio.addEventListener("ended", () => pause());
audio.addEventListener("error", () => {
  const h = $("hint");
  h.textContent = "Video gagal dimuat. Cek nama file video di repo, harus persis sama dengan AUDIO_SRC, lalu Ctrl+F5.";
  h.style.display = "block";
});

$("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key.toLowerCase() === "f") $("full").click();
});

// ---------- mulai ----------
if (AUDIO_SRC) audio.src = AUDIO_SRC;
resize();
applyLyrics();
requestAnimationFrame(frame);
</script>
</body>
</html>
