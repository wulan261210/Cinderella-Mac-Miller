<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinderella-Mac-Miller</title>

<style>
:root {
  --bg: #000;
  --fg: #f5f0df;
  --accent: #d9d2bd;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: Consolas, "Courier New", monospace;
  overflow: hidden;
}

canvas#view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.9));
  z-index: 5;
}

button {
  background: #111;
  color: var(--fg);
  border: 1px solid #444;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
}
button:hover { border-color: var(--accent); color: var(--accent); }

input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
#time { font-size: 12px; opacity: .7; min-width: 90px; }

#hint {
  position: fixed;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 4px;
  z-index: 6;
  display: none;
  max-width: 92vw;
  text-align: center;
}
</style>
</head>

<body>
<canvas id="view"></canvas>
<div id="hint"></div>
<audio id="audio" preload="auto"></audio>

<!-- LIRIK (tersembunyi, tidak tampil di halaman)
     Format: menit:detik | teks | warna | gambar (opsional)
     Warna: satu warna = semua huruf. Beberapa warna = sesuai jumlah kata,
     atau sesuai jumlah huruf (satu warna per huruf). Kata dalam [ ] = warna sorot. -->
<textarea id="lyrics" hidden>
00:01 | Cinderella Mac-Miller | #d9d2bd #e8d44d
00:13 | I been waitin' | #f5f0df
00:14 | all night for this | #d9d2bd
00:15 | moment | #d9d2bd #f5f0df #e8d44d #d9d2bd #e8d44d #f5f0df
00:17 | I been waitin' | #f5f0df
00:18 | all year for this | #e8d44d
00:19 | moment | #d9d2bd #e8d44d #f5f0df #d9d2bd #e8d44d #f5f0df
</textarea>

<div id="bar">
  <button id="play">▶ Mulai</button>
  <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
  <span id="time">0:00</span>
  <button id="full">⛶</button>
</div>

<script>
// ====== PENGATURAN ======
const AUDIO_SRC = "SnapTik_Cinderella_Mac_Miller_with_emm_macmiller.mp4"; // nama file lagu di repo
const DEFAULT_COLOR = "#f5f0df";   // warna teks bawaan
const HIGHLIGHT = "#ff4fd8";       // warna kata dalam [ ]
const RAMP = " .:-=+*#%@";         // urutan karakter dari terang lemah ke kuat
const SCRAMBLE = "abcdefghijklmnopqrstuvwxyz0123456789@#$%&*+=";
// ========================

const view = document.getElementById("view");
const vctx = view.getContext("2d");
const off = document.createElement("canvas");
const octx = off.getContext("2d", { willReadFrequently: true });
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);

let cols, rows, cw, chh, fontPx, VW, VH;
let timeline = [];
let audioReady = false;
let playing = false;
let clockStart = 0;
let pausedAt = 0;

// ---------- ukuran layar ----------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = innerWidth * dpr;
  view.height = innerHeight * dpr;
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  fontPx = innerWidth < 600 ? 7 : 10;
  cw = fontPx * 0.6;
  chh = fontPx;
  cols = Math.floor(innerWidth / cw);
  rows = Math.floor(innerHeight / chh);
  off.width = cols;
  off.height = rows;
  VW = cols;
  VH = rows * chh / cw; // tinggi "virtual" agar huruf tidak melar
}
addEventListener("resize", resize);

// ---------- parsing lirik ----------
function parse(txt) {
  return txt.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("//"))
    .map(l => {
      const p = l.split("|").map(s => s.trim());
      const m = p[0].match(/^(\d+):(\d+(?:\.\d+)?)$/);
      if (!m) return null;

      const pal = (p[2] || "").split(/\s+/).filter(c => /^#[0-9a-fA-F]{3,8}$/.test(c));
      if (!pal.length) pal.push(DEFAULT_COLOR);

      const e = {
        t: +m[1] * 60 + +m[2],
        text: p[1] || "",
        pal,
        img: p[3] && !p[3].startsWith("#") ? p[3] : "",
        imgEl: null
      };
      if (e.img) {
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => (e.imgEl = im);
        im.onerror = () => (e.imgEl = null);
        im.src = e.img;
      }
      return e;
    })
    .filter(Boolean)
    .sort((a, b) => a.t - b.t);
}

function applyLyrics() {
  timeline = parse($("lyrics").value);
  updateSeekMax();
}

// ---------- pewarnaan teks ----------
// 1 warna = semua huruf | jumlah warna = jumlah huruf -> per huruf | selain itu -> per kata
function colorize(text, pal) {
  let plain = "";
  const hl = [];
  text.split(/(\[[^\]]*\])/).forEach(s => {
    if (!s) return;
    const isH = s.startsWith("[") && s.endsWith("]");
    for (const ch of isH ? s.slice(1, -1) : s) { plain += ch; hl.push(isH); }
  });

  const letters = plain.replace(/\s/g, "").length;
  let li = 0, wi = -1, inWord = false, prev = pal[0];
  const parts = [];
  for (let i = 0; i < plain.length; i++) {
    const ch = plain[i];
    let c;
    if (/\s/.test(ch)) {
      inWord = false;
      c = prev;
    } else {
      if (!inWord) { wi++; inWord = true; }
      c = pal.length === 1 ? pal[0] : pal.length === letters ? pal[li] : pal[wi % pal.length];
      li++;
    }
    if (hl[i]) c = HIGHLIGHT;
    prev = c;
    const last = parts[parts.length - 1];
    if (last && last.c === c) last.s += ch; else parts.push({ s: ch, c });
  }
  return parts;
}

// ---------- waktu ----------
function now() {
  if (audioReady) return audio.currentTime;
  return playing ? (performance.now() - clockStart) / 1000 : pausedAt;
}

function duration() {
  if (audioReady && isFinite(audio.duration)) return audio.duration;
  const last = timeline[timeline.length - 1];
  return last ? last.t + 5 : 30;
}

function updateSeekMax() { $("seek").max = duration(); }

function fmt(s) {
  s = Math.max(0, s);
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}

// ---------- gambar teks ke canvas kecil ----------
function drawEntry(e, alpha) {
  octx.globalAlpha = alpha;
  const hasImg = e.imgEl && e.imgEl.naturalWidth;
  const y = hasImg ? VH * 0.26 : VH * 0.5;

  const parts = colorize(e.text, e.pal);

  let size = VH * 0.2;
  const setFont = () => (octx.font = `700 ${size}px "Segoe UI", Arial, sans-serif`);
  const total = () => parts.reduce((a, p) => a + octx.measureText(p.s).width, 0);
  setFont();
  const maxW = VW * 0.9;
  const w0 = total();
  if (w0 > maxW) { size *= maxW / w0; setFont(); }

  octx.textAlign = "left";
  octx.textBaseline = "middle";
  let x = VW / 2 - total() / 2;
  parts.forEach(p => {
    octx.fillStyle = p.c;
    octx.fillText(p.s, x, y);
    x += octx.measureText(p.s).width;
  });

  if (hasImg) {
    const im = e.imgEl;
    const boxW = VW * 0.8, boxH = VH * 0.5;
    const sc = Math.min(boxW / im.naturalWidth, boxH / im.naturalHeight);
    const iw = im.naturalWidth * sc, ih = im.naturalHeight * sc;
    octx.drawImage(im, VW / 2 - iw / 2, VH * 0.68 - ih / 2, iw, ih);
  }
  octx.globalAlpha = 1;
}

// ---------- loop utama ----------
function frame() {
  const t = now();

  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = "#000";
  octx.fillRect(0, 0, cols, rows);
  octx.setTransform(1, 0, 0, cw / chh, 0, 0);

  let idx = -1;
  for (let i = 0; i < timeline.length; i++) if (t >= timeline[i].t) idx = i;

  let local = 99;
  if (idx >= 0) {
    const e = timeline[idx];
    const next = timeline[idx + 1];
    const end = next ? next.t : e.t + 4;
    local = t - e.t;
    const fadeIn = Math.min(1, local / 0.12);
    const fadeOut = Math.min(1, (end - t) / 0.1);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    drawEntry(e, alpha);
  }

  octx.setTransform(1, 0, 0, 1, 0, 0);
  const data = octx.getImageData(0, 0, cols, rows).data;

  vctx.fillStyle = "#000";
  vctx.fillRect(0, 0, innerWidth, innerHeight);
  vctx.font = `${fontPx}px Consolas, "Courier New", monospace`;
  vctx.textBaseline = "top";

  let lastColor = "";
  const decode = local < 0.5 ? local / 0.5 : 1; // efek "terurai" saat baris baru muncul

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const lum = Math.max(r, g, b) / 255;
      if (lum < 0.07) continue;

      let ch = RAMP[Math.min(RAMP.length - 1, Math.floor(lum * RAMP.length))];
      if (Math.random() > decode) ch = SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0];
      else if (Math.random() < 0.015) ch = RAMP[Math.max(1, RAMP.length - 2 - ((Math.random() * 3) | 0))];

      const col = `rgb(${r},${g},${b})`;
      if (col !== lastColor) { vctx.fillStyle = col; lastColor = col; }
      vctx.fillText(ch, x * cw, y * chh);
    }
  }

  // UI waktu
  $("time").textContent = fmt(t) + " / " + fmt(duration());
  if (document.activeElement !== $("seek")) $("seek").value = t;

  requestAnimationFrame(frame);
}

// ---------- kontrol ----------
function play() {
  if (audioReady) audio.play().catch(() => {});
  else clockStart = performance.now() - pausedAt * 1000;
  playing = true;
  $("play").textContent = "⏸ Jeda";
}

function pause() {
  if (audioReady) audio.pause();
  else pausedAt = (performance.now() - clockStart) / 1000;
  playing = false;
  $("play").textContent = "▶ Mulai";
}

$("play").onclick = () => (playing ? pause() : play());

$("seek").oninput = e => {
  const v = +e.target.value;
  if (audioReady) audio.currentTime = v;
  else {
    pausedAt = v;
    clockStart = performance.now() - v * 1000;
  }
};

audio.addEventListener("loadedmetadata", () => { audioReady = true; updateSeekMax(); });
audio.addEventListener("ended", () => pause());
audio.addEventListener("error", () => {
  const h = $("hint");
  h.textContent = "Lagu gagal dimuat. Cek nama file lagu di repo, harus persis sama dengan AUDIO_SRC, lalu Ctrl+F5.";
  h.style.display = "block";
});

$("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key.toLowerCase() === "f") $("full").click();
});

// ---------- mulai ----------
if (AUDIO_SRC) audio.src = AUDIO_SRC;
resize();
applyLyrics();
requestAnimationFrame(frame);
</script>
</body>
</html>
