<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinderella-Mac-Miller</title>

<style>
:root {
  --bg: #000;
  --fg: #f5f0df;
  --accent: #d9d2bd;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: Consolas, "Courier New", monospace;
  overflow: hidden;
}

canvas#view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.9));
  z-index: 5;
  flex-wrap: wrap;
}

button, label.btn {
  background: #111;
  color: var(--fg);
  border: 1px solid #444;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
}
button:hover, label.btn:hover { border-color: var(--accent); color: var(--accent); }

input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
input[type=file] { display: none; }
#time { font-size: 12px; opacity: .7; min-width: 90px; }

#editor {
  position: fixed;
  left: 0; right: 0; bottom: 52px;
  background: rgba(0,0,0,.92);
  border-top: 1px solid #333;
  padding: 12px;
  z-index: 4;
  display: none;
}
#editor.open { display: block; }
#editor textarea {
  width: 100%;
  height: 32vh;
  background: #0a0a0a;
  color: var(--fg);
  border: 1px solid #333;
  font: 13px/1.5 Consolas, "Courier New", monospace;
  padding: 8px;
  resize: vertical;
}
#editor small { display: block; opacity: .6; margin-top: 6px; }
#hint {
  position: fixed;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 4px;
  z-index: 6;
  display: none;
  max-width: 92vw;
  text-align: center;
}
</style>
</head>

<body>
<canvas id="view"></canvas>
<div id="hint"></div>
<audio id="audio" preload="auto"></audio>

<div id="editor">
<textarea id="lyrics" spellcheck="false">// Tempel liriknya di bawah ini, satu baris per baris, lalu klik "Sync ketuk".
// Atau tulis manual: menit:detik | teks | warna (opsional) | gambar (opsional)
// Kata dalam [kurung siku] memakai warna sorot.
00:01 | Cinderella-Mac-Miller | #d9d2bd
00:02 |Uh, $ign | #f5f0df
00:07 | Oh no, no, no, no, no, no, no, no, no | #e8d44d
00:11 | No, no ($ign) | #d9d2bd
00:13 | Ayy | #f5f0df
00:14 | I been waitin' all night for this moment | #e8d44d
00:16 | I been waitin' all year for this moment | #d9d2bd </textarea>
<button id="apply">Terapkan</button>
<button id="syncbtn">Sync ketuk</button>
<small>Gambar (png/jpg) taruh di repo yang sama, lalu tulis nama filenya di kolom ke-4.</small>
<small>Cara cepat: tempel lirik satu baris per baris (tanpa waktu), klik "Sync ketuk", lalu tekan Enter atau ketuk layar tepat saat tiap baris mulai dinyanyikan. Backspace untuk mengulang satu baris.</small>
</div>

<div id="bar">
  <button id="play">▶ Mulai</button>
    <input type="file" id="file" accept="audio/*">
  </label>
  <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
  <span id="time">0:00</span>
  <button id="full">⛶</button>
</div>

<script>
// ====== PENGATURAN ======
const AUDIO_SRC ="SnapTik_Cinderella_Mac_Miller_with_emm_macmiller.mp4";      // taruh file lagu di repo dengan nama ini (opsional)
const DEFAULT_COLOR = "#f5f0df";   // warna teks bawaan
const HIGHLIGHT = "#ff4fd8";       // warna kata dalam [ ]
const RAMP = " .:-=+*#%@";         // urutan karakter dari terang lemah ke kuat
const SCRAMBLE = "abcdefghijklmnopqrstuvwxyz0123456789@#$%&*+=";
// ========================

const view = document.getElementById("view");
const vctx = view.getContext("2d");
const off = document.createElement("canvas");
const octx = off.getContext("2d", { willReadFrequently: true });
const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);

let cols, rows, cw, chh, fontPx, VW, VH;
let timeline = [];
let audioReady = false;
let playing = false;
let clockStart = 0;
let pausedAt = 0;

// ---------- ukuran layar ----------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = innerWidth * dpr;
  view.height = innerHeight * dpr;
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  fontPx = innerWidth < 600 ? 7 : 10;
  cw = fontPx * 0.6;
  chh = fontPx;
  cols = Math.floor(innerWidth / cw);
  rows = Math.floor(innerHeight / chh);
  off.width = cols;
  off.height = rows;
  VW = cols;
  VH = rows * chh / cw; // tinggi "virtual" agar huruf tidak melar
}
addEventListener("resize", resize);

// ---------- parsing lirik ----------
function parse(txt) {
  return txt.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("//"))
    .map(l => {
      const p = l.split("|").map(s => s.trim());
      const m = p[0].match(/^(\d+):(\d+(?:\.\d+)?)$/);
      if (!m) return null;
      const e = {
        t: +m[1] * 60 + +m[2],
        text: p[1] || "",
        color: p[2] || DEFAULT_COLOR,
        img: p[3] || "",
        imgEl: null
      };
      if (e.img) {
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => (e.imgEl = im);
        im.onerror = () => (e.imgEl = null);
        im.src = e.img;
      }
      return e;
    })
    .filter(Boolean)
    .sort((a, b) => a.t - b.t);
}

function applyLyrics() {
  timeline = parse($("lyrics").value);
  updateSeekMax();
}

// ---------- waktu ----------
function now() {
  if (audioReady) return audio.currentTime;
  return playing ? (performance.now() - clockStart) / 1000 : pausedAt;
}

function duration() {
  if (audioReady && isFinite(audio.duration)) return audio.duration;
  const last = timeline[timeline.length - 1];
  return last ? last.t + 5 : 30;
}

function updateSeekMax() { $("seek").max = duration(); }

function fmt(s) {
  s = Math.max(0, s);
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}

// ---------- gambar teks ke canvas kecil ----------
function drawEntry(e, alpha) {
  octx.globalAlpha = alpha;
  const hasImg = e.imgEl && e.imgEl.naturalWidth;
  const y = hasImg ? VH * 0.26 : VH * 0.5;

  // pecah teks: [kata] = warna sorot
  const parts = [];
  e.text.split(/(\[[^\]]*\])/).forEach(s => {
    if (!s) return;
    if (s.startsWith("[")) parts.push({ s: s.slice(1, -1), c: HIGHLIGHT });
    else parts.push({ s, c: e.color });
  });

  let size = VH * 0.2;
  const setFont = () => (octx.font = `700 ${size}px "Segoe UI", Arial, sans-serif`);
  const total = () => parts.reduce((a, p) => a + octx.measureText(p.s).width, 0);
  setFont();
  const maxW = VW * 0.9;
  const w0 = total();
  if (w0 > maxW) { size *= maxW / w0; setFont(); }

  octx.textAlign = "left";
  octx.textBaseline = "middle";
  let x = VW / 2 - total() / 2;
  parts.forEach(p => {
    octx.fillStyle = p.c;
    octx.fillText(p.s, x, y);
    x += octx.measureText(p.s).width;
  });

  if (hasImg) {
    const im = e.imgEl;
    const boxW = VW * 0.8, boxH = VH * 0.5;
    const sc = Math.min(boxW / im.naturalWidth, boxH / im.naturalHeight);
    const iw = im.naturalWidth * sc, ih = im.naturalHeight * sc;
    octx.drawImage(im, VW / 2 - iw / 2, VH * 0.68 - ih / 2, iw, ih);
  }
  octx.globalAlpha = 1;
}

// ---------- loop utama ----------
function frame() {
  const t = now();

  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = "#000";
  octx.fillRect(0, 0, cols, rows);
  octx.setTransform(1, 0, 0, cw / chh, 0, 0);

  let idx = -1;
  for (let i = 0; i < timeline.length; i++) if (t >= timeline[i].t) idx = i;

  let local = 99;
  if (idx >= 0) {
    const e = timeline[idx];
    const next = timeline[idx + 1];
    const end = next ? next.t : e.t + 4;
    local = t - e.t;
    const fadeIn = Math.min(1, local / 0.12);
    const fadeOut = Math.min(1, (end - t) / 0.1);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    drawEntry(e, alpha);
  }

  octx.setTransform(1, 0, 0, 1, 0, 0);
  const data = octx.getImageData(0, 0, cols, rows).data;

  vctx.fillStyle = "#000";
  vctx.fillRect(0, 0, innerWidth, innerHeight);
  vctx.font = `${fontPx}px Consolas, "Courier New", monospace`;
  vctx.textBaseline = "top";

  let lastColor = "";
  const decode = local < 0.5 ? local / 0.5 : 1; // efek "terurai" saat baris baru muncul

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const lum = Math.max(r, g, b) / 255;
      if (lum < 0.07) continue;

      let ch = RAMP[Math.min(RAMP.length - 1, Math.floor(lum * RAMP.length))];
      if (Math.random() > decode) ch = SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0];
      else if (Math.random() < 0.015) ch = RAMP[Math.max(1, RAMP.length - 2 - ((Math.random() * 3) | 0))];

      const col = `rgb(${r},${g},${b})`;
      if (col !== lastColor) { vctx.fillStyle = col; lastColor = col; }
      vctx.fillText(ch, x * cw, y * chh);
    }
  }

  // UI waktu
  $("time").textContent = fmt(t) + " / " + fmt(duration());
  if (document.activeElement !== $("seek")) $("seek").value = t;

  requestAnimationFrame(frame);
}

// ---------- kontrol ----------
function play() {
  if (audioReady) audio.play();
  else clockStart = performance.now() - pausedAt * 1000;
  playing = true;
  $("play").textContent = "⏸ Jeda";
}

function pause() {
  if (audioReady) audio.pause();
  else pausedAt = (performance.now() - clockStart) / 1000;
  playing = false;
  $("play").textContent = "▶ Mulai";
}

$("play").onclick = () => (playing ? pause() : play());

$("seek").oninput = e => {
  const v = +e.target.value;
  if (audioReady) audio.currentTime = v;
  else {
    pausedAt = v;
    clockStart = performance.now() - v * 1000;
  }
};

$("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  audio.src = URL.createObjectURL(f);
  if (playing) pause();
};

audio.addEventListener("loadedmetadata", () => { audioReady = true; updateSeekMax(); });
audio.addEventListener("ended", () => pause());

$("edit").onclick = () => $("editor").classList.toggle("open");
$("apply").onclick = () => { applyLyrics(); $("editor").classList.remove("open"); };
$("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (sync) {
    if (e.key === "Enter") { e.preventDefault(); syncMark(); }
    if (e.key === "Backspace") { e.preventDefault(); syncUndo(); }
    return;
  }
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key.toLowerCase() === "e") $("editor").classList.toggle("open");
  if (e.key.toLowerCase() === "f") $("full").click();
});


// ---------- sync ketuk ----------
let sync = null;
const pad2 = n => String(n).padStart(2, "0");
const stamp = t => pad2(Math.floor(t / 60)) + ":" + (t % 60).toFixed(1).padStart(4, "0");

function showHint() {
  const h = $("hint");
  if (!sync) { h.style.display = "none"; return; }
  const L = sync.lines[sync.i];
  h.style.display = "block";
  h.textContent = `SYNC ${sync.i + 1}/${sync.lines.length} - tekan Enter / ketuk saat mulai: "${L.text}"`;
}

function startSync() {
  const lines = $("lyrics").value.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("//"))
    .map(l => {
      const p = l.split("|").map(s => s.trim());
      if (/^\d+:\d+/.test(p[0])) return { text: p[1] || "", color: p[2] || "", img: p[3] || "" };
      return { text: l, color: "", img: "" };
    })
    .filter(l => l.text);
  if (!lines.length) return;
  sync = { lines, i: 0, out: [] };
  $("editor").classList.remove("open");
  if (document.activeElement) document.activeElement.blur();
  if (playing) pause();
  if (audioReady) audio.currentTime = 0; else pausedAt = 0;
  timeline = [];
  play();
  showHint();
}

function syncMark() {
  if (!sync) return;
  const L = sync.lines[sync.i];
  let row = stamp(now()) + " | " + L.text;
  if (L.color || L.img) row += " | " + (L.color || DEFAULT_COLOR) + (L.img ? " | " + L.img : "");
  sync.out.push(row);
  sync.i++;
  if (sync.i >= sync.lines.length) finishSync(); else showHint();
}

function syncUndo() {
  if (!sync || sync.i === 0) return;
  sync.i--;
  sync.out.pop();
  showHint();
}

function finishSync() {
  const out = sync.out;
  sync = null;
  showHint();
  pause();
  $("lyrics").value =
    "// Hasil sync. Boleh diedit manual: menit:detik | teks | warna | gambar\n" + out.join("\n");
  if (audioReady) audio.currentTime = 0; else pausedAt = 0;
  applyLyrics();
  $("editor").classList.add("open");
}

$("syncbtn").onclick = startSync;
view.addEventListener("pointerdown", () => { if (sync) syncMark(); });

// ---------- mulai ----------
if (AUDIO_SRC) audio.src = AUDIO_SRC;
resize();
applyLyrics();
requestAnimationFrame(frame);
</script>
</body>
</html>
